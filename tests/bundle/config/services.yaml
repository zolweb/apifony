services:
    Zol\Apifony\Tests\TestOpenApiServer\Api\FirstOperation\FirstOperationController:
        class: Zol\Apifony\Tests\TestOpenApiServer\Api\FirstOperation\FirstOperationController
        arguments:
            $validator: '@zol_apifony_tests_test_open_api_server.validator'
        public: true
    Zol\Apifony\Tests\TestOpenApiServer\Api\RawOperation\RawOperationController:
        class: Zol\Apifony\Tests\TestOpenApiServer\Api\RawOperation\RawOperationController
        arguments:
            $validator: '@zol_apifony_tests_test_open_api_server.validator'
        public: true
    Zol\Apifony\Tests\TestOpenApiServer\Api\RawShapesOperation\RawShapesOperationController:
        class: Zol\Apifony\Tests\TestOpenApiServer\Api\RawShapesOperation\RawShapesOperationController
        arguments:
            $validator: '@zol_apifony_tests_test_open_api_server.validator'
        public: true
    Zol\Apifony\Tests\TestOpenApiServer\Api\ComponentRefOperation\ComponentRefOperationController:
        class: Zol\Apifony\Tests\TestOpenApiServer\Api\ComponentRefOperation\ComponentRefOperationController
        arguments:
            $validator: '@zol_apifony_tests_test_open_api_server.validator'
        public: true
    Zol\Apifony\Tests\TestOpenApiServer\Api\ComponentBucketOperation\ComponentBucketOperationController:
        class: Zol\Apifony\Tests\TestOpenApiServer\Api\ComponentBucketOperation\ComponentBucketOperationController
        arguments:
            $validator: '@zol_apifony_tests_test_open_api_server.validator'
        public: true
    Zol\Apifony\Tests\TestOpenApiServer\Format\CustomValidator:
        class: Zol\Apifony\Tests\TestOpenApiServer\Format\CustomValidator
        public: true
        tags:
            - validator.constraint_validator
    Zol\Apifony\Tests\TestOpenApiServer\Format\IgnoredFormatValidator:
        class: Zol\Apifony\Tests\TestOpenApiServer\Format\IgnoredFormatValidator
        public: true
        tags:
            - validator.constraint_validator
    zol_apifony_tests_test_open_api_server.constraint_validator_factory:
        class: Zol\Apifony\Tests\TestOpenApiServer\Api\ConstraintValidatorFactory
        calls:
            -
                - addValidator
                -
                    - '@Zol\Apifony\Tests\TestOpenApiServer\Format\CustomValidator'
            -
                - addValidator
                -
                    - '@Zol\Apifony\Tests\TestOpenApiServer\Format\IgnoredFormatValidator'
    zol_apifony_tests_test_open_api_server.validator_builder:
        class: Symfony\Component\Validator\ValidatorBuilder
        factory:
            - Symfony\Component\Validator\Validation
            - createValidatorBuilder
        calls:
            -
                - enableAttributeMapping
            -
                - setConstraintValidatorFactory
                -
                    - '@zol_apifony_tests_test_open_api_server.constraint_validator_factory'
    zol_apifony_tests_test_open_api_server.validator:
        class: Symfony\Component\Validator\Validation
        factory:
            - '@zol_apifony_tests_test_open_api_server.validator_builder'
            - getValidator
